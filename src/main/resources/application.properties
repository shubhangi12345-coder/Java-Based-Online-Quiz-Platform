# ===== Application =====
spring.application.name=online-quiz-platform
server.port=8080

# ===== Database (MySQL) =====
# NO password is stored here. Put your own values in a file called
# application-local.properties (same folder as pom.xml). That file is ignored by Git.
# See application-local.properties.example for the exact lines.
# Alternatively set the environment variables DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quiz_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.config.import=optional:file:./application-local.properties

# ===== JPA / Hibernate =====
# "update" creates missing tables/columns from the entity classes on startup (good for a student project).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Keeps the database session open while a page renders, so templates can read lazy relations.
spring.jpa.open-in-view=true

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== First admin account (created only if the users table is empty) =====
# Set these in application-local.properties. If left empty, no admin is created.
app.admin.name=${APP_ADMIN_NAME:Administrator}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ===== Optional demo data (off by default) =====
# true = create a demo creator, two demo participants and one approved quiz on first start.
# Needs app.demo.password (the password given to the demo accounts).
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.demo.password=${APP_DEMO_PASSWORD:}

# ===== Background job that closes quiz attempts whose time ran out =====
app.sweeper.enabled=true
