<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quizzes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">All quizzes</h1>
        <form method="get" th:action="@{/admin/quizzes}" class="d-flex gap-2">
            <label for="status" class="visually-hidden">Filter by status</label>
            <select id="status" name="status" class="form-select">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == selectedStatus}">Status</option>
            </select>
            <button type="submit" class="btn btn-brand">Filter</button>
        </form>
    </div>
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Title</th><th>Category</th><th>Difficulty</th><th>Creator</th><th>Questions</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="q : ${quizzes}">
                    <td th:text="${q.title}">Title</td>
                    <td th:text="${q.category}">Category</td>
                    <td><span th:replace="~{fragments/layout :: difficultyBadge(${q.difficulty})}"></span></td>
                    <td th:text="${q.creator.fullName}">Creator</td>
                    <td th:text="${#lists.size(q.questions)}">0</td>
                    <td><span th:replace="~{fragments/layout :: statusBadge(${q.status})}"></span></td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/quizzes/{id}(id=${q.id})}">View</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(quizzes)}"><td colspan="7" class="text-muted">No quizzes found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
