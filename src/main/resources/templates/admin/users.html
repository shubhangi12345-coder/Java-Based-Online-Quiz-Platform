<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Users')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h3 mb-0">Users</h1>
        <form method="get" th:action="@{/admin/users}" class="d-flex gap-2">
            <label for="role" class="visually-hidden">Filter by role</label>
            <select id="role" name="role" class="form-select">
                <option value="">All roles</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == selectedRole}">Role</option>
            </select>
            <button type="submit" class="btn btn-brand">Filter</button>
        </form>
    </div>

    <div class="card p-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="u : ${users}">
                    <td><span th:text="${u.fullName}">Name</span>
                        <span class="badge bg-info text-dark" th:if="${u.email == currentUser.email}">You</span></td>
                    <td th:text="${u.email}">email</td>
                    <td th:text="${u.role.label}">Role</td>
                    <td><span class="badge" th:classappend="${u.enabled} ? 'bg-success' : 'bg-secondary'" th:text="${u.enabled} ? 'Active' : 'Disabled'">Active</span></td>
                    <td th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">date</td>
                    <td>
                        <div class="d-flex gap-2" th:unless="${u.email == currentUser.email}">
                            <form th:action="@{/admin/users/{id}/role(id=${u.id})}" method="post" class="d-flex gap-1">
                                <label class="visually-hidden" th:for="'role' + ${u.id}">New role</label>
                                <select name="role" th:id="'role' + ${u.id}" class="form-select form-select-sm">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == u.role}">Role</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary">Change</button>
                            </form>
                            <form th:if="${u.enabled}" th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"
                                  onsubmit="return confirm('Disable this account? The user will not be able to log in.')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Disable</button>
                            </form>
                            <form th:unless="${u.enabled}" th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post"
                                  onsubmit="return confirm('Enable this account again?')">
                                <button type="submit" class="btn btn-sm btn-outline-success">Enable</button>
                            </form>
                        </div>
                        <span class="text-muted small" th:if="${u.email == currentUser.email}">your account</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}"><td colspan="6" class="text-muted">No users found.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2">A role change takes effect the next time that user logs in.</p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
