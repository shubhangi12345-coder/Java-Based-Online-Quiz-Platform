<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('System settings')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h3 mb-3">System settings</h1>
    <form class="card p-4" style="max-width: 560px" th:action="@{/admin/settings}" th:object="${settingsForm}" method="post" novalidate>
        <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{registrationOpen}">
            <label class="form-check-label" for="registrationOpen">Public registration is open</label>
            <div class="form-text">When off, new participants cannot create accounts.</div>
        </div>
        <div class="mb-3">
            <label for="defaultPassingPercent" class="form-label">Default passing percentage</label>
            <input type="number" min="1" max="100" class="form-control" th:field="*{defaultPassingPercent}"
                   th:classappend="${#fields.hasErrors('defaultPassingPercent')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{defaultPassingPercent}">Error</div>
            <div class="form-text">Suggested value when a creator makes a new quiz.</div>
        </div>
        <button type="submit" class="btn btn-brand">Save settings</button>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
