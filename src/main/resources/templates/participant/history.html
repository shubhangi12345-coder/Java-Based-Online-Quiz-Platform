<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My attempts')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 class="h3 mb-3">My attempts</h1>
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Quiz</th><th>Started</th><th>Score</th><th>Percentage</th><th>Result</th><th></th></tr></thead>
                <tbody>
                <tr th:each="a : ${attempts}">
                    <td th:text="${a.quiz.title}">Quiz</td>
                    <td th:text="${#temporals.format(a.startedAt, 'dd MMM yyyy HH:mm')}">date</td>
                    <td th:text="${a.finished} ? ${a.score} + ' / ' + ${a.totalMarks} : '-'">0</td>
                    <td th:text="${a.finished} ? ${#numbers.formatDecimal(a.percentage, 1, 1)} + '%' : '-'">0%</td>
                    <td><span class="badge" th:classappend="${a.finished} ? (${a.passed} ? 'bg-success' : 'bg-danger') : 'bg-warning text-dark'"
                              th:text="${a.finished} ? (${a.passed} ? 'Passed' : 'Failed') : 'In progress'">Passed</span></td>
                    <td><a class="btn btn-sm btn-outline-primary" th:if="${a.finished}" th:href="@{/participant/attempts/{id}/result(id=${a.id})}">Review</a>
                        <a class="btn btn-sm btn-warning" th:unless="${a.finished}" th:href="@{/participant/attempts/{id}/take(id=${a.id})}">Resume</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(attempts)}"><td colspan="6" class="text-muted">You have not taken any quiz yet. <a th:href="@{/participant/quizzes}">Browse quizzes</a>.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
