<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quiz in progress')}"></head>
<body>
<!-- The WHOLE page is one form. th:action adds the CSRF token. The correct answers are NOT in this page. -->
<form id="quizForm" method="post" th:action="@{/participant/attempts/{id}/submit(id=${attempt.id})}">

    <div class="take-bar py-2">
        <div class="container d-flex align-items-center gap-3">
            <div class="flex-grow-1">
                <div class="fw-bold" th:text="${quiz.title}">Quiz title</div>
                <div class="small text-muted"><span id="answeredCount" th:attr="data-total=${#lists.size(quiz.questions)}">0</span>
                    of <span th:text="${#lists.size(quiz.questions)}">5</span> answered</div>
            </div>
            <div class="text-center">
                <div class="small text-muted">Time left</div>
                <div id="timer" class="timer" role="timer" th:attr="data-seconds=${remainingSeconds}">--:--</div>
            </div>
            <button type="submit" class="btn btn-success">Submit quiz</button>
        </div>
    </div>

    <main class="container py-4" style="max-width: 820px">
        <div class="alert alert-danger d-none" id="timeUpMessage" role="alert">Time is up. Submitting your answers...</div>

        <div class="card p-4 mb-3" th:each="q, st : ${quiz.questions}">
            <div class="d-flex justify-content-between text-muted small mb-2">
                <span th:text="'Question ' + ${st.count} + ' of ' + ${#lists.size(quiz.questions)}">Question 1</span>
                <span th:text="${q.marks} + ' mark(s)'">1 mark</span>
            </div>
            <h2 class="h5 mb-3" th:text="${q.text}">Question text</h2>
            <fieldset>
                <legend class="visually-hidden" th:text="'Answers for question ' + ${st.count}">Answers</legend>
                <label class="choice" th:each="o, os : ${q.options}">
                    <input type="radio" th:name="'q_' + ${q.id}" th:value="${o.id}">
                    <span class="choice-body">
                        <span class="choice-letter" th:text="${os.index == 0} ? 'A' : (${os.index == 1} ? 'B' : (${os.index == 2} ? 'C' : 'D'))">A</span>
                        <span th:text="${o.text}">Option</span>
                    </span>
                </label>
            </fieldset>
        </div>

        <button type="submit" class="btn btn-success btn-lg w-100">Submit quiz</button>
    </main>
</form>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/quiz-timer.js}"></script>
</body>
</html>
