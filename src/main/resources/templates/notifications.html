<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Notifications</h1>
        <form th:action="@{/notifications/read-all}" method="post" th:if="${unreadCount != null and unreadCount > 0}">
            <button type="submit" class="btn btn-sm btn-outline-secondary">Mark all as read</button>
        </form>
    </div>
    <div class="card">
        <ul class="list-group list-group-flush">
            <li class="list-group-item" th:each="n : ${notifications}" th:classappend="${!n.seen} ? 'fw-bold'">
                <span th:text="${n.message}">Message</span>
                <a th:if="${n.link != null}" th:href="@{${n.link}}" class="ms-2 small">Open</a>
                <div class="small text-muted fw-normal" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm')}">date</div>
            </li>
            <li class="list-group-item text-muted" th:if="${#lists.isEmpty(notifications)}">You have no notifications.</li>
        </ul>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
