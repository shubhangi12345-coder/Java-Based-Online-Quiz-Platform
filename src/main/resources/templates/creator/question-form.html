<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Question')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 760px">
    <a th:href="@{/creator/quizzes/{id}(id=${quiz.id})}">&larr; Back to <span th:text="${quiz.title}">quiz</span></a>
    <form class="card p-4 mt-2" th:action="@{${formAction}}" th:object="${questionForm}" method="post" novalidate>
        <h1 class="h4 mb-3" th:text="${formTitle}">Question</h1>
        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</div>
        </div>

        <div class="mb-3">
            <label for="text" class="form-label">Question</label>
            <textarea class="form-control" rows="3" th:field="*{text}" th:classappend="${#fields.hasErrors('text')} ? 'is-invalid'" maxlength="1000"></textarea>
            <div class="invalid-feedback" th:errors="*{text}">Error</div>
        </div>

        <fieldset class="mb-3">
            <legend class="form-label fs-6">Options (select the circle of the correct answer)</legend>
            <div class="d-flex align-items-start gap-2 mb-2">
                <div class="form-check pt-2">
                    <input class="form-check-input" type="radio" th:field="*{correctIndex}" value="0" aria-label="Option A is the correct answer">
                </div>
                <div class="flex-grow-1">
                    <label for="option1" class="visually-hidden">Option A</label>
                    <input type="text" class="form-control" maxlength="500" placeholder="Option A" th:field="*{option1}"
                           th:classappend="${#fields.hasErrors('option1')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{option1}">Error</div>
                </div>
            </div>
            <div class="d-flex align-items-start gap-2 mb-2">
                <div class="form-check pt-2">
                    <input class="form-check-input" type="radio" th:field="*{correctIndex}" value="1" aria-label="Option B is the correct answer">
                </div>
                <div class="flex-grow-1">
                    <label for="option2" class="visually-hidden">Option B</label>
                    <input type="text" class="form-control" maxlength="500" placeholder="Option B" th:field="*{option2}"
                           th:classappend="${#fields.hasErrors('option2')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{option2}">Error</div>
                </div>
            </div>
            <div class="d-flex align-items-start gap-2 mb-2">
                <div class="form-check pt-2">
                    <input class="form-check-input" type="radio" th:field="*{correctIndex}" value="2" aria-label="Option C is the correct answer">
                </div>
                <div class="flex-grow-1">
                    <label for="option3" class="visually-hidden">Option C</label>
                    <input type="text" class="form-control" maxlength="500" placeholder="Option C" th:field="*{option3}"
                           th:classappend="${#fields.hasErrors('option3')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{option3}">Error</div>
                </div>
            </div>
            <div class="d-flex align-items-start gap-2 mb-2">
                <div class="form-check pt-2">
                    <input class="form-check-input" type="radio" th:field="*{correctIndex}" value="3" aria-label="Option D is the correct answer">
                </div>
                <div class="flex-grow-1">
                    <label for="option4" class="visually-hidden">Option D</label>
                    <input type="text" class="form-control" maxlength="500" placeholder="Option D" th:field="*{option4}"
                           th:classappend="${#fields.hasErrors('option4')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{option4}">Error</div>
                </div>
            </div>
            <div class="text-danger small" th:if="${#fields.hasErrors('correctIndex')}" th:errors="*{correctIndex}">Error</div>
        </fieldset>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="marks" class="form-label">Marks (1-10)</label>
                <input type="number" min="1" max="10" class="form-control" th:field="*{marks}" th:classappend="${#fields.hasErrors('marks')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{marks}">Error</div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="difficulty" class="form-label">Difficulty</label>
                <select class="form-select" th:field="*{difficulty}">
                    <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}">MEDIUM</option>
                </select>
            </div>
        </div>
        <div class="mb-3">
            <label for="explanation" class="form-label">Explanation (optional, shown after the quiz)</label>
            <textarea class="form-control" rows="2" th:field="*{explanation}" maxlength="1000"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-brand">Save question</button>
            <a class="btn btn-outline-secondary" th:href="@{/creator/quizzes/{id}(id=${quiz.id})}">Cancel</a>
        </div>
    </form>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
