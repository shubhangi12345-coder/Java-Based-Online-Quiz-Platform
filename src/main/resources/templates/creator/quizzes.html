<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My quizzes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">My quizzes</h1>
        <a class="btn btn-brand" th:href="@{/creator/quizzes/new}">+ New quiz</a>
    </div>
    <div class="card p-3">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead><tr><th>Title</th><th>Category</th><th>Difficulty</th><th>Questions</th><th>Duration</th><th>Status</th><th></th></tr></thead>
                <tbody>
                <tr th:each="q : ${quizzes}">
                    <td th:text="${q.title}">Title</td>
                    <td th:text="${q.category}">Category</td>
                    <td><span th:replace="~{fragments/layout :: difficultyBadge(${q.difficulty})}"></span></td>
                    <td th:text="${#lists.size(q.questions)}">0</td>
                    <td th:text="${q.durationMinutes} + ' min'">10 min</td>
                    <td><span th:replace="~{fragments/layout :: statusBadge(${q.status})}"></span></td>
                    <td><a class="btn btn-sm btn-outline-primary" th:href="@{/creator/quizzes/{id}(id=${q.id})}">Manage</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(quizzes)}"><td colspan="7" class="text-muted">No quizzes yet. <a th:href="@{/creator/quizzes/new}">Create your first quiz</a>.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
